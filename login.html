<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nairobi Vibe</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ============================================================
        // SUPABASE CONFIG - NEW KEYS
        // ============================================================
        const SUPABASE_URL = 'https://upnymrrbwlkcwoswpzbe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nsiBvuQzpXMKetTh60xTuA_8VcT2xDf';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        window.supabaseFunctions = {
            supabase: supabase,
            signIn: async (email, password) => {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                return { data, error };
            },
            signOut: async () => {
                const { error } = await supabase.auth.signOut();
                return { error };
            },
            resetPassword: async (email) => {
                const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });
                return { data, error };
            },
            getProfile: async (userId) => {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('user_id', userId)
                    .single();
                return { data, error };
            }
        };
        
        console.log('✅ Supabase initialized with NEW keys!');
        console.log('🔗 URL:', SUPABASE_URL);
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Open Sans', "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f7053e, #8b0a2a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-wrapper { width: 100%; max-width: 440px; }
        
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 45px 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .login-card .logo { text-align: center; margin-bottom: 25px; }
        .login-card .logo .logo-icon {
            display: inline-block; width: 70px; height: 70px;
            background: linear-gradient(135deg, #E0006C, #b30057);
            border-radius: 15px; color: #fff;
            font-size: 32px; font-weight: 800;
            line-height: 70px; text-align: center;
        }
        .login-card .logo h1 { font-size: 24px; font-weight: 800; color: #E0006C; margin-top: 8px; }
        .login-card .logo p { color: #888; font-size: 14px; }
        
        .alert-banner {
            background: #fff3cd; border-left: 4px solid #ffc107;
            padding: 12px 15px; border-radius: 10px;
            margin-bottom: 20px; display: none;
            align-items: center; gap: 10px;
        }
        .alert-banner.show { display: flex; }
        .alert-banner i { color: #ffc107; font-size: 18px; }
        .alert-banner .alert-text { font-size: 13px; color: #856404; flex: 1; }
        .alert-banner .alert-close { cursor: pointer; color: #856404; font-size: 18px; opacity: 0.7; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #333; margin-bottom: 5px; }
        .form-group label .required { color: #e74c3c; margin-left: 2px; }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper i {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: #999; font-size: 16px;
        }
        .form-group .input-wrapper input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: 2px solid #e8e8e8; border-radius: 12px;
            font-size: 15px; font-family: 'Open Sans', sans-serif;
            transition: all 0.3s ease; background: #fafafa; color: #333;
        }
        .form-group .input-wrapper input:focus {
            outline: none; border-color: #E0006C;
            background: #fff; box-shadow: 0 0 0 4px rgba(224, 0, 108, 0.1);
        }
        .form-group .input-wrapper .password-toggle {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%); color: #999;
            cursor: pointer; background: none; border: none; font-size: 16px;
        }
        
        .form-options {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .remember-me { display: flex; align-items: center; gap: 8px; }
        .remember-me input[type="checkbox"] {
            width: 18px; height: 18px; cursor: pointer; accent-color: #E0006C;
        }
        .remember-me label { font-size: 14px; color: #666; cursor: pointer; }
        .forgot-link { font-size: 14px; color: #E0006C; font-weight: 600; }
        
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #E0006C, #b30057);
            color: #fff; border: none; border-radius: 12px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(224, 0, 108, 0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .divider {
            display: flex; align-items: center;
            margin: 20px 0; color: #999; font-size: 13px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #e8e8e8;
        }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }
        
        .social-login { display: flex; gap: 12px; margin-bottom: 20px; }
        .social-login .social-btn {
            flex: 1; padding: 10px;
            border: 2px solid #e8e8e8; border-radius: 12px;
            background: #fafafa; cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; font-weight: 600; font-size: 14px; color: #333;
        }
        .social-login .social-btn:hover { border-color: #E0006C; transform: translateY(-2px); }
        .social-login .social-btn i { font-size: 20px; }
        .social-login .social-btn.google i { color: #DB4437; }
        .social-login .social-btn.facebook i { color: #4267B2; }
        
        .register-link { text-align: center; font-size: 14px; color: #666; }
        .register-link a { color: #E0006C; font-weight: 700; }
        
        .error-message {
            color: #e74c3c; font-size: 12px;
            font-weight: 600; margin-top: 5px; display: none;
        }
        .error-message.show { display: block; }
        .form-group.error .input-wrapper input { border-color: #e74c3c; background: #fdf2f2; }
        .form-group.error .input-wrapper i { color: #e74c3c; }
        .form-group.success .input-wrapper input { border-color: #27ae60; background: #f0faf4; }
        .form-group.success .input-wrapper i { color: #27ae60; }
        
        .loader {
            display: none; width: 24px; height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader.show { display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 15px 25px; border-radius: 12px;
            color: #fff; font-weight: 600; font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            transform: translateX(120%);
            transition: all 0.4s ease; z-index: 9999; max-width: 400px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #27ae60, #1e8449); }
        .toast.error { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .toast.info { background: linear-gradient(135deg, #3498db, #2980b9); }
        .toast .toast-close {
            float: right; margin-left: 15px;
            cursor: pointer; opacity: 0.8; font-size: 18px;
        }
        
        @media (max-width: 500px) {
            .login-card { padding: 30px 20px 25px; }
            .social-login { flex-direction: column; }
            .form-options { flex-direction: column; gap: 10px; align-items: flex-start; }
            .login-card .logo h1 { font-size: 20px; }
            .btn-login { font-size: 16px; padding: 12px; }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #E0006C; border-radius: 10px; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card" id="loginCard">
        
        <div class="logo">
            <div class="logo-icon">NV</div>
            <h1>Welcome Back</h1>
            <p>Login to your Nairobi Vibe account</p>
        </div>
        
        <div class="alert-banner" id="alertBanner">
            <i class="fas fa-info-circle"></i>
            <span class="alert-text" id="alertText">Your account is pending admin approval.</span>
            <span class="alert-close" id="alertClose">&times;</span>
        </div>
        
        <form id="loginForm" novalidate>
            
            <div class="form-group" id="emailGroup">
                <label>Email Address <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email address" required autocomplete="email">
                </div>
                <div class="error-message" id="emailError">Please enter a valid email address</div>
            </div>
            
            <div class="form-group" id="passwordGroup">
                <label>Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="passwordError">Please enter your password</div>
            </div>
            
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-link" id="forgotPassword">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Login</span>
                <span class="loader" id="btnLoader"></span>
                <i class="fas fa-arrow-right" id="btnIcon"></i>
            </button>
            
        </form>
        
        <div class="divider">Or continue with</div>
        
        <div class="social-login">
            <button class="social-btn google" id="googleLogin">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="social-btn facebook" id="facebookLogin">
                <i class="fab fa-facebook"></i> Facebook
            </button>
        </div>
        
        <div class="register-link">
            Don't have an account? <a href="signup.html">Create one now</a>
        </div>
        
    </div>
</div>

<div class="toast" id="toast">
    <span class="toast-close" id="toastClose">&times;</span>
    <span id="toastMessage">Notification</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const btnIcon = document.getElementById('btnIcon');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastClose = document.getElementById('toastClose');
        const togglePassword = document.getElementById('togglePassword');
        const alertBanner = document.getElementById('alertBanner');
        const alertText = document.getElementById('alertText');
        const alertClose = document.getElementById('alertClose');
        const forgotPassword = document.getElementById('forgotPassword');
        
        if (typeof window.supabaseFunctions === 'undefined') {
            console.warn('⚠️ Supabase functions not loaded. Re-initializing...');
            const SUPABASE_URL = 'https://upnymrrbwlkcwoswpzbe.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_nsiBvuQzpXMKetTh60xTuA_8VcT2xDf';
            
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                window.supabaseFunctions = {
                    supabase: supabase,
                    signIn: async (email, password) => {
                        const { data, error } = await supabase.auth.signInWithPassword({
                            email: email,
                            password: password
                        });
                        return { data, error };
                    },
                    signOut: async () => {
                        const { error } = await supabase.auth.signOut();
                        return { error };
                    },
                    resetPassword: async (email) => {
                        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
                            redirectTo: window.location.origin + '/reset-password.html'
                        });
                        return { data, error };
                    }
                };
                console.log('✅ Supabase re-initialized successfully!');
            } else {
                showToast('System error. Please refresh the page.', 'error');
                return;
            }
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const pendingMsg = urlParams.get('pending');
        if (pendingMsg === 'true') {
            alertBanner.classList.add('show');
            alertText.textContent = 'Your account is pending admin approval. You\'ll receive an email once verified.';
        }
        
        alertClose.addEventListener('click', function() {
            alertBanner.classList.remove('show');
        });
        
        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        email.addEventListener('blur', function() {
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.value);
            validateField(this, 'emailGroup', 'emailError', isValid);
        });
        
        password.addEventListener('blur', function() {
            const isValid = this.value.length >= 1;
            validateField(this, 'passwordGroup', 'passwordError', isValid);
        });
        
        function validateField(input, groupId, errorId, isValid) {
            const group = document.getElementById(groupId);
            const error = document.getElementById(errorId);
            
            if (input.value.trim() === '') {
                group.classList.remove('success', 'error');
                error.classList.remove('show');
                return;
            }
            
            if (isValid) {
                group.classList.remove('error');
                group.classList.add('success');
                error.classList.remove('show');
            } else {
                group.classList.remove('success');
                group.classList.add('error');
                error.classList.add('show');
            }
        }
        
        try {
            const savedEmail = localStorage.getItem('nairobi_vibe_email');
            if (savedEmail) {
                email.value = savedEmail;
                rememberMe.checked = true;
            }
        } catch (e) {}
        
        const redirectUrl = urlParams.get('redirect') || 'index.html';
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                validateField(email, 'emailGroup', 'emailError', false);
                isValid = false;
            } else {
                validateField(email, 'emailGroup', 'emailError', true);
            }
            
            if (password.value.length < 1) {
                validateField(password, 'passwordGroup', 'passwordError', false);
                isValid = false;
            } else {
                validateField(password, 'passwordGroup', 'passwordError', true);
            }
            
            if (!isValid) {
                showToast('Please fill in all fields correctly', 'error');
                return;
            }
            
            loginBtn.disabled = true;
            btnText.textContent = 'Logging in...';
            btnLoader.classList.add('show');
            btnIcon.style.display = 'none';
            
            if (rememberMe.checked) {
                try { localStorage.setItem('nairobi_vibe_email', email.value); } catch (e) {}
            } else {
                try { localStorage.removeItem('nairobi_vibe_email'); } catch (e) {}
            }
            
            try {
                const { data, error } = await window.supabaseFunctions.supabase.auth.signInWithPassword({
                    email: email.value.trim(),
                    password: password.value
                });
                
                if (error) throw error;
                
                if (data && data.user) {
                    const user = data.user;
                    const userData = user.user_metadata || {};
                    
                    const sessionData = {
                        id: user.id,
                        email: user.email,
                        name: userData.full_name || user.email.split('@')[0],
                        role: userData.role || 'user',
                        phone: userData.phone || '',
                        location: userData.location || '',
                        loggedIn: true,
                        loginTime: new Date().toISOString()
                    };
                    
                    try {
                        localStorage.setItem('nairobi_vibe_session', JSON.stringify(sessionData));
                    } catch (e) {}
                    
                    showToast('Welcome back, ' + sessionData.name + '! 🎉', 'success');
                    
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                }
                
            } catch (error) {
                console.error('❌ Login error:', error);
                
                let errorMsg = error.message || 'Login failed. Please try again.';
                
                if (errorMsg.includes('Invalid login credentials')) {
                    errorMsg = 'Invalid email or password. Please try again.';
                } else if (errorMsg.includes('Email not confirmed')) {
                    errorMsg = 'Please confirm your email first. Check your inbox!';
                }
                
                showToast(errorMsg, 'error');
                
                loginBtn.disabled = false;
                btnText.textContent = 'Login';
                btnLoader.classList.remove('show');
                btnIcon.style.display = 'inline-block';
            }
        });
        
        document.getElementById('googleLogin').addEventListener('click', function() {
            showToast('Google login coming soon! 🔜', 'info');
        });
        
        document.getElementById('facebookLogin').addEventListener('click', function() {
            showToast('Facebook login coming soon! 🔜', 'info');
        });
        
        forgotPassword.addEventListener('click', async function(e) {
            e.preventDefault();
            const emailValue = email.value.trim();
            
            if (emailValue && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
                try {
                    const { error } = await window.supabaseFunctions.supabase.auth.resetPasswordForEmail(emailValue, {
                        redirectTo: window.location.origin + '/reset-password.html'
                    });
                    
                    if (error) throw error;
                    
                    showToast(`Password reset link sent to ${emailValue}`, 'success');
                } catch (error) {
                    showToast('Error sending reset link. Please try again.', 'error');
                }
            } else {
                showToast('Please enter your email address to reset your password', 'info');
                email.focus();
            }
        });
        
        function showToast(message, type = 'info') {
            toastMessage.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 5000);
        }
        
        toastClose.addEventListener('click', function() {
            toast.classList.remove('show');
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                toast.classList.remove('show');
                alertBanner.classList.remove('show');
            }
        });
        
        console.log('✅ Login Page Loaded - NEW Supabase keys');
        console.log('🔗 Redirect URL:', redirectUrl);
        
    });
</script>

</body>
</html>
